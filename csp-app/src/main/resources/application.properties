# =========================================================================
# CSP-NG L5a — Application properties (Quarkus 3.x)
# =========================================================================
# Aucun secret reel dans ce fichier — les valeurs sensibles sont
# injectees via variables d'environnement ${CSP_DB_*}.
# =========================================================================

# -- Datasource JDBC (Flyway uniquement, hors datapath) --
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${CSP_DB_HOST:localhost}:${CSP_DB_PORT:5432}/${CSP_DB_NAME:csp_config}?sslmode=${CSP_DB_SSL_MODE:verify-full}
quarkus.datasource.username=${CSP_DB_USER:csp_app}
quarkus.datasource.password=${CSP_DB_PASSWORD}
quarkus.datasource.jdbc.max-size=2
# Désactive le check Agroal JDBC bloquant (la santé DB est vérifiée réactivement via DatabaseHealthCheck)
quarkus.datasource.health.enabled=false

# -- Flyway (migration au demarrage) --
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=public
quarkus.flyway.create-schemas=true

# -- Datasource reactive PG (runtime, client non-bloquant) --
quarkus.datasource.reactive.url=postgresql://${CSP_DB_HOST:localhost}:${CSP_DB_PORT:5432}/${CSP_DB_NAME:csp_config}
quarkus.datasource.reactive.max-size=10
# ssl-mode=verify-full en prod (par defaut)
quarkus.datasource.reactive.postgresql.ssl-mode=${CSP_DB_SSL_MODE:verify-full}

# -- HTTP & Lifecycle --
quarkus.http.port=${CSP_HTTP_PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30s

# -- Topologie TLS / Reverse Proxy (derrière nginx frontal) --
# En prod, nginx tourne sur le même hôte (127.0.0.1) et fait proxy_pass vers 127.0.0.1:8080.
# L'application écoute exclusivement sur 127.0.0.1 en prod (%prod.quarkus.http.host=127.0.0.1) :
# les endpoints /q/health et /q/metrics sont ainsi confinés au loopback par construction (défense en profondeur).
# Si l'architecture évolue vers un load-balancer externe requérant une écoute sur interface dédiée, cette décision devra être revue.
# nginx doit envoyer X-Forwarded-Proto: https — ne jamais élargir trusted-proxies à des IP distantes.
%prod.quarkus.http.host=127.0.0.1
%prod.quarkus.http.port=8080
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.trusted-proxies=127.0.0.1,::1
%prod.quarkus.http.proxy.enable-forwarded-host=true
%prod.quarkus.http.proxy.enable-forwarded-prefix=true
# En dev/test, pas de TLS obligatoire : le filtre applicatif gère require-https
%dev.csp.admin.require-https=false
%test.csp.admin.require-https=false

# -- Logging --
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.category."com.bowman.cspng.sessions.audit".level=INFO
quarkus.log.category."com.bowman.cspng.ecm".level=INFO

# -- Tables de résolutions chaînes (srvid) & providers (provid) --
# Fichiers externes optionnels (si non définis, chargement depuis ressources embarquées /srvid/)
# csp.srvid.file=/path/to/oscam.srvid
# csp.providers.file=/path/to/oscam.provid

# -- Ring buffers logs (Admin UI) --
csp.logs.ring-size=${CSP_LOGS_RING_SIZE:2000}
csp.logs.worker-ring-size=${CSP_LOGS_WORKER_RING_SIZE:2000}
csp.logs.max-worker-buffers=${CSP_LOGS_MAX_WORKER_BUFFERS:64}
csp.logs.capture-prefixes=${CSP_LOGS_CAPTURE_PREFIXES:com.bowman.cspng}

# -- Quarkus Security (Basic auth + Admin Cookie Session) --
# Basic conservé et prioritaire pour API ; Cookie CSPADMINSESSION pour WebUI SPA
quarkus.http.auth.basic=true
quarkus.security.jaxrs.deny-unannotated-endpoints=false

# -- Admin Session Management (csp-web) --
csp.web.session.idle-timeout=8h
csp.web.session.max-lifetime=24h
csp.web.session.max-per-user=5
csp.web.session.max-total=1000
csp.web.login.rate-limit-per-min=20

# -- CSP Admin API security --
# HTTPS requis pour /api/admin en prod (désactivable en dev/test)
csp.admin.require-https=true
# Bootstrap admin initial
csp.admin.bootstrap-required=true
# Bcrypt cost pour nouveaux comptes (defaut 12)
csp.admin.bcrypt-cost=12

# -- Request body max size --
quarkus.http.limits.max-body-size=64K

# -- Runtime core (L5e) --
csp.runtime.enabled=${CSP_RUNTIME_ENABLED:true}
%test.csp.runtime.enabled=false
%test.quarkus.http.test-port=0
csp.secrets.allowed-file-roots=/run/secrets,/etc/csp/secrets
%test.csp.secrets.allowed-file-roots=/tmp/csp-secrets-test

# -- Import CCcam (Lot A socle) --
# csp.import.secret-root doit être une sous-racine de csp.secrets.allowed-file-roots
# (contrainte vérifiée au démarrage de SecretMaterializer ; /etc/csp/secrets/imported est sous /etc/csp/secrets)
csp.import.secret-root=/etc/csp/secrets/imported
%test.csp.import.secret-root=/tmp/csp-secrets-test/imported
csp.import.dns-cache-ttl-seconds=60
csp.import.max-file-size-kb=64
csp.import.max-lines=100
csp.import.max-concurrent-probes=4
csp.import.probe-timeout-ms=15000
csp.import.cooldown-seconds=30

# -- CSP Admin WebUI static resources (/admin/*) --
# Quarkus sert META-INF/resources automatiquement. Filtres HTTP pour headers statiques.
# matches = regex (Vert.x). Utiliser .* pour wildcard.
quarkus.http.filter.admin-html.header."Cache-Control"=no-store
quarkus.http.filter.admin-html.matches=/admin/index\.html
quarkus.http.filter.admin-html.order=10
quarkus.http.filter.admin-html2.header."Cache-Control"=no-store
quarkus.http.filter.admin-html2.matches=/admin/?$
quarkus.http.filter.admin-html2.order=10
quarkus.http.filter.admin-csp.header."Content-Security-Policy"=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'
quarkus.http.filter.admin-csp.matches=/admin/.*
quarkus.http.filter.admin-csp.order=5
quarkus.http.filter.admin-nosniff.header."X-Content-Type-Options"=nosniff
quarkus.http.filter.admin-nosniff.matches=/admin/.*
quarkus.http.filter.admin-nosniff.order=5
quarkus.http.filter.admin-referrer.header."Referrer-Policy"=no-referrer
quarkus.http.filter.admin-referrer.matches=/admin/.*
quarkus.http.filter.admin-referrer.order=5
quarkus.http.filter.admin-permissions.header."Permissions-Policy"=camera=(), microphone=(), geolocation=()
quarkus.http.filter.admin-permissions.matches=/admin/.*
quarkus.http.filter.admin-permissions.order=5
quarkus.http.filter.admin-hsts.header."Strict-Transport-Security"=max-age=31536000
quarkus.http.filter.admin-hsts.matches=/admin/.*
quarkus.http.filter.admin-hsts.order=5
quarkus.http.filter.admin-frame.header."X-Frame-Options"=DENY
quarkus.http.filter.admin-frame.matches=/admin/.*
quarkus.http.filter.admin-frame.order=5
quarkus.http.filter.admin-assets.header."Cache-Control"=public, max-age=60, must-revalidate
quarkus.http.filter.admin-assets.matches=/admin/assets/.*
quarkus.http.filter.admin-assets.order=20

# -- SSE streaming headers (Vert.x filter, exact /api/admin/events) --
quarkus.http.filter.sse-cache.header."Cache-Control"=no-cache, no-store, must-revalidate
quarkus.http.filter.sse-cache.matches=/api/admin/events
quarkus.http.filter.sse-cache.order=5
quarkus.http.filter.sse-accel.header."X-Accel-Buffering"=no
quarkus.http.filter.sse-accel.matches=/api/admin/events
quarkus.http.filter.sse-accel.order=5
quarkus.http.filter.sse-nosniff.header."X-Content-Type-Options"=nosniff
quarkus.http.filter.sse-nosniff.matches=/api/admin/events
quarkus.http.filter.sse-nosniff.order=5

# -- DCW Filter Runtime (L7) --
# Chemin du fichier de persistance des groupes de liens detectLinks.
# Format JSON v1 interne (pas de Java Serialization). Le repertoire parent
# doit exister et etre accessible en ecriture par le processus CSP.
# Prod : /var/lib/csp/links.json (RW pour l'utilisateur csp uniquement).
# Test : /tmp/csp-dcw-test/links.json.
csp.dcw.links-file=${CSP_DCW_LINKS_FILE:/var/lib/csp/links.json}
%test.csp.dcw.links-file=/tmp/csp-dcw-test/links.json

# Taille max du fichier de liens (controle avant lecture/ecriture).
# Valeurs acceptees : entre 8192 et 10485760 (10 MiB). Defaut : 1 MiB.
csp.dcw.max-file-size-bytes=${CSP_DCW_MAX_FILE_SIZE:1048576}

# Delai de debounce avant persistance des changements de groupes de liens (ms).
# Borne : [100..60000]. Defaut : 1000 (1s).
# Les changements pendant ce delai sont coalesces ; un dirty flag garantit
# qu'aucun changement n'est perdu.
csp.dcw.save-debounce-ms=${CSP_DCW_SAVE_DEBOUNCE_MS:1000}
# -- SSE Admin Event Broker (L SSE cœur) --
csp.sse.enabled=false
csp.sse.replay-size=500
csp.sse.subscriber-queue-size=64
csp.sse.max-subscribers=50
csp.sse.heartbeat-ms=15000
csp.sse.scan-ms=${CSP_SSE_SCAN_MS:1000}
%test.csp.sse.enabled=true

csp.infinispan.enabled=false
csp.infinispan.cluster-name=${CSP_INFINISPAN_CLUSTER:csp-infinispan}
csp.infinispan.cache-name=csp-cw
csp.infinispan.ttl-ms=30000
csp.infinispan.max-entries=100000
csp.infinispan.jgroups.config-file=jgroups-udp-csp.xml
csp.infinispan.jgroups.bind-address=${CSP_INFINISPAN_BIND_ADDR:127.0.0.1}
csp.infinispan.jgroups.bind-port=${CSP_INFINISPAN_BIND_PORT:7800}
csp.infinispan.jgroups.mcast-address=${CSP_INFINISPAN_MCAST_ADDR:228.10.10.10}
csp.infinispan.jgroups.mcast-port=${CSP_INFINISPAN_MCAST_PORT:45588}
csp.infinispan.keystore.path=${CSP_INFINISPAN_KEYSTORE:}
csp.infinispan.keystore.alias=${CSP_INFINISPAN_KEY_ALIAS:}
csp.infinispan.keystore.password=${CSP_INFINISPAN_KEYSTORE_PASSWORD:}

# -- CSPv2 Cluster TCP (Lot app) --
csp.cspv2.enabled=${CSP_CSPV2_ENABLED:false}

# -- Relay workers v1 (ADR 0002, socle central W0-W3) --
# TTL config worker : bornee 5000..300000, defaut 30000. Jamais de lease 2s en dur.
csp.relay.worker-config-ttl-ms=${CSP_RELAY_WORKER_CONFIG_TTL_MS:30000}
# Node local pour anti-boucles (OBLIGATOIRE des qu'un relais est actif, FIX #6).
csp.relay.local-node-id=${CSP_RELAY_LOCAL_NODE_ID:}
# Canal controle worker HTTPS mTLS sur port dedie (separe du portail nginx,
# jamais de cert client sur le portail). Desactive par defaut.
csp.relay.worker-enabled=${CSP_RELAY_WORKER_ENABLED:false}
csp.relay.worker-port=${CSP_RELAY_WORKER_PORT:8444}
csp.relay.worker-tls-cert-file=${CSP_RELAY_WORKER_TLS_CERT_FILE:}
csp.relay.worker-tls-key-file=${CSP_RELAY_WORKER_TLS_KEY_FILE:}
csp.relay.worker-tls-trust-file=${CSP_RELAY_WORKER_TLS_TRUST_FILE:}
csp.relay.ack-max-body=${CSP_RELAY_ACK_MAX_BODY:524288}
