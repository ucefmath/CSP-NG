# Test profile: desactiver Flyway et PG par defaut
csp.config.pg.enabled=false
quarkus.flyway.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/csp_test
quarkus.datasource.username=csp_test
quarkus.datasource.password=csp_test
quarkus.datasource.reactive.url=postgresql://localhost:5432/csp_test
quarkus.datasource.reactive.postgresql.ssl-mode=disable

# Test: desactiver bootstrap admin et HTTPS requis (auth basic géré par profils de test)
csp.admin.bootstrap-required=false
csp.admin.require-https=false

