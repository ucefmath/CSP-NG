# =====================================================================
# csp.example.com — reverse proxy TLS + gatekeeper reCAPTCHA -> csp-app
# Contrats ops :
#  1. proxy_pass vers 127.0.0.1:8080 (IPv4 explicite, l'app n'écoute pas en IPv6)
#  2. X-Forwarded-Proto / -Host / -For / -Port / -Prefix + Forwarded ÉCRASÉS ou
#     NEUTRALISÉS (jamais de valeur d'origine client relayée)
#  3. /q et /q/* -> 404, déclarés AVANT le catch-all (jamais proxifiés)
#  4. Aucun élargissement des proxys de confiance (loopback uniquement, côté app)
# =====================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name csp.example.com;

    ssl_certificate     /etc/letsencrypt/live/csp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csp.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/csp.example.com.access.log;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/csp.example.com.error.log;

    client_max_body_size 256k;
    server_tokens off;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header WWW-Authenticate;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /q/ { access_log off; return 404; }
    location = /q   { access_log off; return 404; }

    location /gatekeeper/ {
        proxy_pass http://127.0.0.1:18095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /gatekeeper-verify {
        internal;
        proxy_pass http://127.0.0.1:18095/verify-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location = /      { return 302 https://csp.example.com/admin/index.html; }
    location = /admin { return 301 https://csp.example.com/admin/index.html; }

    location = /api/admin/events {
        auth_request /gatekeeper-verify;
        error_page 401 = @gatekeeper_api_denied;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host csp.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host csp.example.com;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/admin/ {
        auth_request /gatekeeper-verify;
        error_page 401 = @gatekeeper_api_denied;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host csp.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host csp.example.com;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        auth_request /gatekeeper-verify;
        error_page 401 = @gatekeeper_challenge;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host csp.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host csp.example.com;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location @gatekeeper_challenge {
        return 302 https://$host/gatekeeper/challenge?return_to=$scheme://$host$request_uri;
    }
    location @gatekeeper_api_denied {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 403 '{"error":"GATEKEEPER_REQUIRED","message":"Recharger https://csp.example.com/ pour resoudre le captcha."}';
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name csp.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
    location / { return 301 https://csp.example.com$request_uri; }
}
