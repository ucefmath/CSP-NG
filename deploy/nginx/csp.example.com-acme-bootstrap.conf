# Fichier TEMPORAIRE — remplacé par csp.example.com.conf après certbot
server {
    listen 80;
    listen [::]:80;
    server_name csp.example.com;

    access_log /var/log/nginx/csp.example.com.access.log;
    error_log  /var/log/nginx/csp.example.com.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
    location / { return 503; }
}
