# Fail2ban filter for CSP-NG authentication failures
# /etc/fail2ban/filter.d/csp-auth.conf

[Definition]
journalmatch = _SYSTEMD_UNIT=csp-app.service

prefregex = ^.*<F-CONTENT>(AUTH_FAIL|PREAUTH_REJECT).+</F-CONTENT>$

failregex = ^AUTH_FAIL\s+protocol=\S+\s+user=\S+\s+ip=<HOST>\s+reason=(?!expired\b|generation-fail\b|quota-connections\b|ip-denied\b)\S+.*$
            ^PREAUTH_REJECT\s+ip=<HOST>\s+reason=(?!expired\b|generation-fail\b|quota-connections\b|ip-denied\b)\S+.*$

ignoreregex = ^.*AUTH_OK.*$
