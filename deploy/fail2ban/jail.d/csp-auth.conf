[csp-auth]
enabled = true
filter = csp-auth
backend = systemd
maxretry = 5
findtime = 10m
bantime = 1h
# ports à adapter aux listeners réels (prod actuelle : 12000 cccam, 12001 cs378x, 443 webadmin HTTPS)
action = iptables-multiport[name=csp-auth, port="12000,12001,443", protocol=tcp]
ignoreip = 127.0.0.1/8 ::1
