name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Unit Tests (without Docker)
        run: mvn -B clean test -Dtest='!*PgTest,!*PgIntegrationTest,!UserRepositoryAclPartialTest,!AdminBootstrapDirectTest,!ConfigUpsertAbsentTest,!CccamImportServiceTest'
