name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: csp-web/frontend/package-lock.json

      # Les tests E2E Playwright (Chromium) s'exécutent pendant le build Maven de csp-web.
      - name: Install Playwright Chromium
        working-directory: csp-web/frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build and Run Unit Tests (without Docker)
        run: mvn -B clean test -Dtest='!*PgTest,!*PgIntegrationTest,!UserRepositoryAclPartialTest,!AdminBootstrapDirectTest,!ConfigUpsertAbsentTest,!CccamImportServiceTest' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.txt
            csp-web/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
